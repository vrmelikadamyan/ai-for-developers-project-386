# One toolchain for developers, git hooks and CI: `mise install`, `mise run install`, then `mise run check`.
[settings]
experimental = true # required for [daemons]

[tools]
node = "24.22.2"
pnpm = "12.18.0"
java = "temurin-25.0.5+8.0.LTS"
hk = "2.11.1"
pkl = "0.33.0"
pitchfork = "2.33.1"
jactionlint = "2.5.0"
shellcheck = "0.11.0"

[hooks]
postinstall = "pnpm install --frozen-lockfile"

# --- Setup ---------------------------------------------------------------

[tasks.install]
description = "Install dependencies and the git hooks"
run = ["pnpm install --frozen-lockfile", "hk install --mise"]

# --- API contract: TypeSpec -> OpenAPI -> SDK ----------------------------

[tasks."api:generate"]
description = "Generate OpenAPI, Spring interfaces and DTOs, and the frontend SDK from TypeSpec"
run = [
  "pnpm run api:compile",
  "cd backend && ./mvnw -B -q generate-sources",
  "pnpm run api:sdk",
]

[tasks."api:check-generated"]
description = "Verify the OpenAPI and SDK against fresh generator output"
run = '''
generated=$(mktemp -d)
trap 'rm -rf "$generated"' EXIT
pnpm run api:compile --option "@typespec/openapi3.emitter-output-dir=$generated/openapi"
pnpm run api:sdk --input "$generated/openapi/openapi.yaml" --output "$generated/sdk"
diff -qr openapi "$generated/openapi"
diff -qr frontend/src/api/generated "$generated/sdk"

changes=$(git ls-files --modified --others --exclude-standard -- openapi frontend/src/api/generated)
if [ -n "$changes" ]; then
  echo "Stage the regenerated files together with the API change:"
  echo "$changes"
  exit 1
fi
'''

# --- Run -----------------------------------------------------------------

# Daemon tasks expect generated code to exist; `mise run dev` generates it once before starting them.
[tasks."backend:dev"]
description = "Run the backend on :8080"
dir = "backend"
run = "exec ./mvnw -q spring-boot:run"

[tasks."frontend:dev"]
description = "Run the Vite dev server on :5173 (proxies /api to :8080)"
dir = "frontend"
run = "exec pnpm run dev"

[daemons.backend]
task = "backend:dev"
ready_port = 8080

[daemons.frontend]
task = "frontend:dev"
ready_port = 5173

[tasks.dev]
description = "Generate API code, then start backend and frontend as background daemons"
run = [
  { task = "api:generate" },
  "mise daemons start backend frontend",
  "echo 'App: http://localhost:5173  API: http://localhost:8080/api/health  Stop: mise daemons stop backend frontend'",
]

# --- Checks --------------------------------------------------------------

[tasks.lint]
description = "Linters and format checks"
depends = ["api:generate"]
run = [
  "pnpm exec tsp format --check 'spec/**/*.tsp'",
  "pnpm --filter frontend run lint",
  "pnpm --filter frontend run format:check",
  "cd backend && ./mvnw -B -q spotless:check",
  "jactionlint .github/workflows/ci.yml .github/workflows/release-please.yml",
]

[tasks.typecheck]
description = "Type checks (tsc for frontend, javac + Error Prone/NullAway for backend)"
depends = ["api:generate"]
run = ["pnpm --filter frontend run typecheck", "cd backend && ./mvnw -B -q compile"]

[tasks.test]
description = "Tests (Vitest, JUnit and the Chromium booking scenario)"
depends = ["api:generate"]
run = [
  "pnpm --filter frontend run test",
  "pnpm --filter frontend exec playwright install --only-shell chromium",
  "cd backend && ./mvnw -B -q test",
]

[tasks.check]
description = "Run every check, the same set CI runs"
run = [{ task = "api:check-generated" }, { task = "lint" }, { task = "typecheck" }, { task = "test" }]

[tasks.fix]
description = "Apply automatic fixes (formatters, safe lint fixes)"
run = [
  "pnpm exec tsp format 'spec/**/*.tsp'",
  "pnpm --filter frontend exec oxlint --fix",
  "pnpm --filter frontend run format",
  "cd backend && ./mvnw -B -q spotless:apply",
]
