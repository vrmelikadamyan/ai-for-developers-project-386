openapi: 3.0.0
info:
  title: Calendar API
  version: 0.1.0
tags:
  - name: system
  - name: meeting-types
  - name: availability
  - name: bookings
paths:
  /api/bookings:
    post:
      operationId: createBooking
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
  /api/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - system
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - meeting-types
    post:
      operationId: createMeetingType
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - meeting-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeInput'
  /api/meeting-types/{id}/availability:
    get:
      operationId: getAvailability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarDay'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - availability
  /api/meeting-types/{id}/slots:
    get:
      operationId: getSlots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - availability
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
    Booking:
      type: object
      required:
        - id
        - meetingTypeName
        - endsAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        meetingTypeName:
          type: string
        endsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/BookingInput'
    BookingInput:
      type: object
      required:
        - meetingTypeId
        - startsAt
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          $ref: '#/components/schemas/Id'
        startsAt:
          type: string
          format: date-time
        guestName:
          type: string
          minLength: 1
          maxLength: 100
        guestEmail:
          type: string
          maxLength: 254
          format: email
    CalendarDay:
      type: object
      required:
        - date
        - freeCount
      properties:
        date:
          type: string
          format: date
        freeCount:
          type: integer
          format: int32
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Id:
      type: string
      format: uuid
    MeetingType:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Id'
      allOf:
        - $ref: '#/components/schemas/MeetingTypeInput'
    MeetingTypeInput:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 540
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
        - status
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
    SlotStatus:
      type: string
      enum:
        - available
        - busy
